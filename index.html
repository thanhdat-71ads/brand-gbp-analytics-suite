<!doctype html>
<html lang="vi" data-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CheckBrand – Bản demo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap">


  <style>
    :root {
      --bg: #f4f5f9;
      --surface-1: #ffffff;
      --surface-2: #f0f1f6;
      --line: #e3e5ee;
      --text-primary: #12141f;
      --text-secondary: #4b5066;
      --text-muted: #7a8097;
      --accent: #b8860b;
      --accent-soft: #fdf3d6;
      --series-1: #2a78d6;
      --series-2: #eb6834;
      --series-3: #1baf7a;
      --good: #0ca30c;
      --neutral: #9aa0b4;
      --bad: #d03b3b;
      --warn: #fab219;
      --serious: #ec835a;
      --seq-1: #cde2fb;
      --seq-2: #86b6ef;
      --seq-3: #3987e5;
      --seq-4: #1c5cab;
      --shadow: 0 1px 2px rgba(15, 20, 40, .06);
      color-scheme: light;
    }

    :root[data-theme="dark"] {
      --bg: #0f1220;
      --surface-1: #171a2b;
      --surface-2: #1e2236;
      --line: #272b42;
      --text-primary: #eceef7;
      --text-secondary: #b4b9d0;
      --text-muted: #838aa6;
      --accent: #f2b84b;
      --accent-soft: #3a2f14;
      --series-1: #3987e5;
      --series-2: #d95926;
      --series-3: #199e70;
      --neutral: #7c8299;
      --bad: #e66767;
      --serious: #ec835a;
      --seq-1: #1d3558;
      --seq-2: #1c5cab;
      --seq-3: #3987e5;
      --seq-4: #86b6ef;
      --shadow: none;
      color-scheme: dark;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]):not([data-theme="dark"]) {
        color-scheme: dark
      }
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text-primary);
      font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif
    }

    button {
      font: inherit;
      color: inherit;
      cursor: pointer
    }

    a {
      color: var(--series-1)
    }

    #app {
      display: grid;
      grid-template-columns: 248px 1fr;
      min-height: 100vh
    }

    #side {
      background: var(--surface-1);
      border-right: 1px solid var(--line);
      padding: 14px 10px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 6px
    }

    #main {
      padding: 22px 28px 60px;
      min-width: 0;
      max-width: 1280px
    }

    .brandbox {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 6px 10px
    }

    .logo {
      width: 34px;
      height: 34px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3px
    }

    .logo i {
      background: #e11d74;
      border-radius: 3px
    }

    .logo i:nth-child(2),
    .logo i:nth-child(3) {
      opacity: .6
    }

    .brandbox b {
      display: block;
      font-size: 15px
    }

    select.brandsel {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--line);
      color: var(--text-primary);
      border-radius: 8px;
      padding: 7px 8px;
      margin-bottom: 6px
    }

    .grp {
      font-size: 11px;
      letter-spacing: .08em;
      color: var(--text-muted);
      padding: 12px 8px 4px;
      text-transform: uppercase
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      text-align: left;
      background: none;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 7px 9px;
      color: var(--text-secondary)
    }

    .nav:hover {
      background: var(--surface-2)
    }

    .nav.on {
      background: var(--surface-2);
      border-color: var(--series-1);
      color: var(--text-primary)
    }

    .nav .ic {
      width: 16px;
      text-align: center
    }

    .badge {
      margin-left: auto;
      background: var(--bad);
      color: #fff;
      border-radius: 10px;
      font-size: 11px;
      padding: 0 6px;
      line-height: 17px
    }

    .healthcard {
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
      margin-top: 8px
    }

    .healthcard .t {
      font-size: 11px;
      letter-spacing: .08em;
      color: var(--text-muted);
      text-transform: uppercase
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .live {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
      padding: 8px 6px 0
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--good);
      display: inline-block
    }

    .dot.off {
      background: var(--neutral)
    }

    .sidefoot {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 6px
    }

    .btn {
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 12px
    }

    .btn:hover {
      border-color: var(--series-1)
    }

    .btn.primary {
      background: var(--series-1);
      border-color: var(--series-1);
      color: #fff
    }

    .btn.on {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent)
    }

    .btn:disabled {
      opacity: .5;
      cursor: wait
    }

    h1 {
      font-size: 22px;
      margin: 0
    }

    .sub {
      color: var(--text-secondary);
      margin: 2px 0 0
    }

    .muted {
      color: var(--text-muted)
    }

    .head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
      flex-wrap: wrap
    }

    .banner {
      background: var(--accent-soft);
      border: 1px solid var(--accent);
      color: var(--text-primary);
      border-radius: 10px;
      padding: 8px 12px;
      margin-bottom: 14px;
      font-size: 13px
    }

    .banner.crit {
      background: rgba(208, 59, 59, .12);
      border-color: var(--bad)
    }

    .grid {
      display: grid;
      gap: 14px
    }

    .g4 {
      grid-template-columns: repeat(4, minmax(0, 1fr))
    }

    .g3 {
      grid-template-columns: repeat(3, minmax(0, 1fr))
    }

    .g2 {
      grid-template-columns: repeat(2, minmax(0, 1fr))
    }

    .g21 {
      grid-template-columns: 2fr 1fr
    }

    @media(max-width:1000px) {

      .g4,
      .g3,
      .g2,
      .g21 {
        grid-template-columns: 1fr 1fr
      }
    }

    @media(max-width:700px) {
      #app {
        grid-template-columns: 1fr
      }

      #side {
        position: static;
        height: auto
      }

      .g4,
      .g3,
      .g2,
      .g21 {
        grid-template-columns: 1fr
      }
    }

    .card {
      background: var(--surface-1);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
      min-width: 0
    }

    .grid .card {
      margin-bottom: 0
    }

    .card h3 {
      margin: 0 0 10px;
      font-size: 12px;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 600
    }

    .kpi .v {
      font-size: 30px;
      font-weight: 650;
      line-height: 1.15
    }

    .kpi .d {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px
    }

    .up {
      color: var(--good)
    }

    .down {
      color: var(--bad)
    }

    .star {
      color: #f2b84b
    }

    table {
      width: 100%;
      border-collapse: collapse
    }

    th {
      font-size: 11px;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: var(--text-muted);
      text-align: left;
      font-weight: 600
    }

    th,
    td {
      padding: 7px 8px;
      border-bottom: 1px solid var(--line);
      vertical-align: top
    }

    tr:last-child td {
      border-bottom: 0
    }

    td.num,
    th.num {
      text-align: right;
      font-variant-numeric: tabular-nums
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      padding: 1px 8px;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--text-secondary);
      background: var(--surface-2);
      white-space: nowrap
    }

    .chip.pos {
      color: var(--good);
      border-color: var(--good)
    }

    .chip.neg {
      color: var(--bad);
      border-color: var(--bad)
    }

    .chip.neu {
      color: var(--text-secondary)
    }

    .chip.mock {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--accent-soft)
    }

    .legend {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--text-secondary);
      margin: 6px 0 0
    }

    .legend i {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      margin-right: 5px;
      vertical-align: -1px
    }

    .bars {
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    .bar {
      display: grid;
      grid-template-columns: minmax(120px, 190px) 1fr 70px;
      gap: 10px;
      align-items: center
    }

    .bar .tr {
      height: 10px;
      background: var(--surface-2);
      border-radius: 5px;
      overflow: hidden;
      display: flex
    }

    .bar .tr i {
      display: block;
      height: 100%;
      border-right: 2px solid var(--surface-1)
    }

    .bar .tr i:last-child {
      border-right: 0
    }

    svg text {
      fill: var(--text-muted);
      font-size: 9.5px
    }

    .scroll {
      max-height: 420px;
      overflow: auto
    }

    svg .grid line {
      stroke: var(--line)
    }

    .tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap
    }

    .starbtn {
      min-width: 46px
    }

    .rev {
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px 16px
    }

    .rev:last-child {
      border-bottom: 0
    }

    .rev .who {
      font-weight: 600
    }

    .rev .txt {
      color: var(--text-secondary);
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
      cursor: pointer
    }

    .rev .txt.open {
      -webkit-line-clamp: unset
    }

    .rev .meta {
      font-size: 12px;
      color: var(--text-muted)
    }

    .rev .side {
      text-align: right
    }

    .acc {
      border: 1px solid var(--line);
      border-radius: 10px;
      margin-bottom: 8px;
      background: var(--surface-2)
    }

    .acc button {
      all: unset;
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      cursor: pointer
    }

    .acc button:hover {
      background: rgba(127, 127, 127, .08)
    }

    .acc.on {
      border-color: var(--series-1)
    }

    .empty {
      padding: 28px;
      text-align: center;
      color: var(--text-muted)
    }

    .sev {
      display: inline-block;
      padding: 0 6px;
      border-radius: 4px;
      font-size: 11px;
      color: #fff
    }

    .sev.s2 {
      background: var(--serious);
      color: #2a1206
    }

    .sev.s3 {
      background: var(--bad)
    }

    .alert {
      display: grid;
      grid-template-columns: 24px 1fr auto;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line)
    }

    .alert.unread .t {
      font-weight: 650
    }

    .keywords {
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    .kw {
      border: 1px solid var(--line);
      background: var(--surface-2);
      border-radius: 8px;
      padding: 3px 9px;
      font-size: 13px
    }

    .kw b {
      color: var(--text-muted);
      font-weight: 500;
      margin-left: 6px;
      font-size: 12px
    }

    .kw.neg {
      border-color: var(--bad)
    }

    #tip {
      position: fixed;
      pointer-events: none;
      background: #0b0d17;
      color: #fff;
      border: 1px solid #2b3050;
      border-radius: 8px;
      padding: 6px 9px;
      font-size: 12px;
      z-index: 50;
      display: none;
      max-width: 260px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, .35)
    }

    #toasts {
      position: fixed;
      right: 16px;
      bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 60
    }

    .toast {
      background: var(--surface-1);
      border: 1px solid var(--bad);
      border-left-width: 4px;
      border-radius: 8px;
      padding: 9px 12px;
      max-width: 340px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, .3)
    }

    .loading {
      padding: 60px;
      text-align: center;
      color: var(--text-muted)
    }

    .hide {
      display: none
    }

    /* =====================================================================
   CheckBrand – Google Maps / Material style theme (lớp ghi đè)
   ---------------------------------------------------------------------
   Nạp SAU app.css trong index.html. Không cần sửa app.css.
   Muốn quay lại giao diện cũ: xóa dòng link file này trong index.html.
   ===================================================================== */

    /* ---------- 1. BẢNG MÀU (Light) – theo bảng màu Google ---------- */
    :root {
      --font-ui: "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;

      --bg: #f8f9fa;
      /* nền trang */
      --surface-1: #ffffff;
      /* thẻ (card) */
      --surface-2: #f1f3f4;
      /* nền phụ, hover */
      --line: #dadce0;
      /* đường kẻ */
      --text-primary: #202124;
      /* chữ chính */
      --text-secondary: #5f6368;
      /* chữ phụ */
      --text-muted: #80868b;
      /* chữ mờ */

      --accent: #fbbc04;
      /* vàng sao Google Maps */
      --accent-soft: #fef7e0;
      --accent-text: #b06000;
      /* chữ trên nền vàng nhạt (vàng sao quá sáng để làm chữ) */
      --gblue: #1a73e8;
      /* xanh Google – nút, link, mục đang chọn */
      --gblue-soft: #e8f0fe;

      --series-1: #1a73e8;
      --good: #188038;
      --bad: #d93025;
      --warn: #f9ab00;

      --radius-card: 12px;
      --radius-chip: 8px;
      --shadow: 0 1px 2px rgba(60, 64, 67, .15), 0 1px 3px 1px rgba(60, 64, 67, .08);
    }

    /* ---------- 2. BẢNG MÀU (Dark) – theo Google Maps dark ---------- */
    :root[data-theme="dark"] {
      --bg: #1f1f1f;
      --surface-1: #28292a;
      --surface-2: #303134;
      --line: #3c4043;
      --text-primary: #e8eaed;
      --text-secondary: #bdc1c6;
      --text-muted: #9aa0a6;
      --accent: #fdd663;
      --accent-soft: #3d3420;
      --accent-text: #fdd663;
      --gblue: #8ab4f8;
      --gblue-soft: #2c3a52;
      --series-1: #8ab4f8;
      --good: #81c995;
      --bad: #f28b82;
      --shadow: none;
    }

    /* ---------- 3. FONT ---------- */
    html,
    body {
      font-family: var(--font-ui);
      font-size: 14px;
      line-height: 1.5;
      letter-spacing: .01em;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input,
    select,
    textarea {
      font-family: inherit;
    }

    /* Số liệu thẳng cột trong bảng & KPI */
    td,
    th,
    .kpi .v,
    .num,
    .star {
      font-variant-numeric: tabular-nums;
    }

    /* ---------- 4. TIÊU ĐỀ: bỏ VIẾT HOA, dùng sentence case như Google ---------- */
    h1 {
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 0;
    }

    .card h3,
    .grp,
    .healthcard .t,
    th {
      text-transform: none;
      letter-spacing: .01em;
    }

    .card h3 {
      font-size: 15px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .grp {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    th {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    /* ---------- 5. THẺ (CARD) ---------- */
    /* Không đổ bóng khi hover: card không bấm được, bóng sẽ gây hiểu nhầm */
    .card {
      border-radius: var(--radius-card);
      border: 1px solid var(--line);
      box-shadow: none;
      overflow-x: auto;
      /* bảng rộng (tiêu đề cột không xuống dòng) cuộn ngang trong card thay vì tràn trang */
    }

    /* ---------- 6. MENU TRÁI – kiểu "viên thuốc" của Google ---------- */
    .nav {
      border: 0;
      border-radius: 999px;
      padding: 8px 14px;
      color: var(--text-secondary);
    }

    .nav:hover {
      background: var(--surface-2);
    }

    .nav.on {
      background: var(--gblue-soft);
      color: var(--gblue);
      font-weight: 500;
      border: 0;
    }

    /* ---------- 7. NÚT ---------- */
    .btn {
      border-radius: 999px;
      padding: 7px 16px;
      font-weight: 500;
    }

    .btn:hover {
      border-color: var(--gblue);
    }

    .btn.primary {
      background: var(--gblue);
      border-color: var(--gblue);
      color: #fff;
    }

    :root[data-theme="dark"] .btn.primary {
      color: #202124;
    }

    /* Nút đang chọn (7/30/90 ngày, lọc sao): xanh thay vì vàng để đủ tương phản */
    .btn.on {
      background: var(--gblue-soft);
      border-color: var(--gblue);
      color: var(--gblue);
    }

    /* ---------- 8. CHIP (nhãn chủ đề, cảm xúc, lọc sao) ---------- */
    .chip,
    .starbtn {
      border-radius: var(--radius-chip);
      font-weight: 500;
    }

    .chip.neg {
      background: #fce8e6;
      color: #c5221f;
    }

    .chip.pos {
      background: #e6f4ea;
      color: #137333;
    }

    .chip.neu {
      background: var(--surface-2);
      color: var(--text-secondary);
    }

    .chip.mock {
      color: var(--accent-text);
    }

    .banner {
      border-color: var(--accent);
    }

    :root[data-theme="dark"] .chip.neg {
      background: #5c2b29;
      color: #f28b82;
    }

    :root[data-theme="dark"] .chip.pos {
      background: #264d34;
      color: #81c995;
    }

    /* ---------- 9. SAO ĐÁNH GIÁ – vàng Google Maps ---------- */
    .star {
      color: var(--accent);
    }

    /* ---------- 10. BẢNG ---------- */
    th,
    td {
      padding: 10px 12px;
    }

    td.num,
    th.num {
      text-align: right;
    }

    tr:hover td {
      background: var(--surface-2);
    }

    /* ---------- 11. LINK ---------- */
    a {
      color: var(--gblue);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    /* =====================================================================
   GIAI ĐOẠN 2 – Google Review kiểu Google Maps
   ===================================================================== */

    /* Khối tổng hợp rating: điểm lớn bên trái, 5 thanh sao bên phải (bấm để lọc) */
    .rating-summary {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 28px;
      align-items: center;
    }

    .rating-summary .rs-score {
      text-align: center;
      min-width: 110px;
    }

    .rating-summary .big {
      font-size: 44px;
      line-height: 1.1;
      font-weight: 400;
      color: var(--text-primary);
    }

    .rating-summary .cnt {
      color: var(--text-secondary);
      font-size: 13px;
    }

    .rbars {
      display: flex;
      flex-direction: column;
      gap: 2px;
      max-width: 520px;
    }

    .rbar {
      display: grid;
      grid-template-columns: 12px 1fr 48px;
      gap: 10px;
      align-items: center;
      width: 100%;
      padding: 3px 6px;
      border: 0;
      border-radius: 6px;
      background: none;
      color: var(--text-secondary);
      text-align: left;
    }

    .rbar:hover {
      background: var(--surface-2);
    }

    .rbar .track {
      display: block;
      height: 8px;
      border-radius: 999px;
      background: var(--surface-2);
      overflow: hidden;
    }

    .rbar:hover .track {
      background: var(--line);
    }

    .rbar .fill {
      display: block;
      height: 100%;
      border-radius: 999px;
      background: var(--accent);
    }

    .rbar .num {
      text-align: right;
    }

    .rbar.on {
      background: var(--gblue-soft);
      color: var(--gblue);
      font-weight: 500;
    }

    .rbar:focus-visible {
      outline: 2px solid var(--gblue);
      outline-offset: 1px;
    }

    @media (max-width: 520px) {
      .rating-summary {
        grid-template-columns: 1fr;
        gap: 12px;
      }
    }

    /* Thẻ review: avatar + tên, dòng sao · ngày · chi nhánh, nội dung cắt 3 dòng */
    .rev {
      display: block;
      padding: 16px 0;
    }

    .rev-head {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 500;
      font-size: 16px;
      flex: none;
    }

    .rev .who {
      font-weight: 500;
      color: var(--text-primary);
    }

    .rev .meta {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .rev-body {
      margin: 8px 0 0 52px;
    }

    .rev .txt {
      color: var(--text-primary);
      -webkit-line-clamp: 3;
      cursor: auto;
    }

    .rev .txt.muted {
      color: var(--text-muted);
      font-style: italic;
    }

    .more-btn {
      border: 0;
      background: none;
      padding: 2px 0;
      margin-top: 2px;
      color: var(--gblue);
      font-weight: 500;
      font-size: 13px;
    }

    .more-btn:hover {
      text-decoration: underline;
    }

    .more-btn[hidden] {
      display: none;
    }

    .rev-chips {
      margin-top: 8px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .rev-foot {
      margin-top: 8px;
      text-align: right;
      font-size: 13px;
    }

    @media (max-width: 520px) {
      .rev-body {
        margin-left: 0;
      }
    }

    /* Phản hồi của chủ sở hữu + nhãn "Chưa phản hồi" cho review 1–3★ */
    .owner-reply {
      margin-top: 10px;
      padding-left: 12px;
      border-left: 2px solid var(--line);
    }

    .owner-reply .meta b {
      font-weight: 500;
      color: var(--text-primary);
    }

    .owner-reply .txt {
      color: var(--text-secondary);
    }

    .chip.noreply {
      background: #fce8e6;
      color: #c5221f;
      border-color: transparent;
    }

    :root[data-theme="dark"] .chip.noreply {
      background: #5c2b29;
      color: #f28b82;
    }

    /* =====================================================================
   GIAI ĐOẠN 3 – Bảng so sánh đối thủ & nhật ký đồng bộ
   ===================================================================== */
    table.comp tr.me td {
      background: var(--gblue-soft);
    }

    table.comp tr.me td:first-child {
      font-weight: 500;
      color: var(--gblue);
    }

    .edot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      margin-right: 6px;
    }

    .chg {
      font-size: 11px;
      margin-left: 4px;
      white-space: nowrap;
    }

    .negbad {
      background: #fce8e6;
      color: #c5221f;
      border-radius: 4px;
      padding: 1px 6px;
    }

    :root[data-theme="dark"] .negbad {
      background: #5c2b29;
      color: #f28b82;
    }

    .negmax {
      font-weight: 700;
    }

    /* Nhật ký đồng bộ: ghi chú 1 dòng (rê chuột xem đủ), dòng có lỗi viền trái đỏ */
    td.notes {
      max-width: 360px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    tr.err td:first-child {
      box-shadow: inset 3px 0 0 var(--bad);
    }

    /* =====================================================================
   CheckBrand – Chuông cảnh báo + toast (đi kèm notify.js)
   Dùng biến màu sẵn có của dashboard; tự hợp chế độ sáng / tối
   ===================================================================== */
    #cbn-root {
      --cbn-blue: var(--gblue, var(--series-1, #1a73e8));
      --cbn-red: var(--bad, #d93025);
      --cbn-star: var(--accent, #fbbc04);
      font-family: inherit;
    }

    /* Chừa chỗ cho chuông ở góc phải tiêu đề trang (chỉ tiêu đề trang, không đụng tiêu đề trong card) */
    #main>.head {
      padding-right: 64px;
    }

    /* ---------- Chuông ---------- */
    #cbn-bell {
      position: fixed;
      top: 14px;
      right: 20px;
      z-index: 1000;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--surface-1, #fff);
      color: var(--text-secondary, #5f6368);
      border: 1px solid var(--line, #dadce0);
      box-shadow: 0 1px 3px rgba(60, 64, 67, .2);
      cursor: pointer;
      transition: background .15s, color .15s;
    }

    #cbn-bell:hover {
      background: var(--surface-2, #f1f3f4);
    }

    #cbn-bell.has-unread {
      color: var(--cbn-red);
    }

    #cbn-bell:focus-visible {
      outline: 2px solid var(--cbn-blue);
      outline-offset: 2px;
    }

    #cbn-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      min-width: 20px;
      height: 20px;
      padding: 0 5px;
      border-radius: 10px;
      background: var(--cbn-red);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      line-height: 20px;
      text-align: center;
      border: 2px solid var(--surface-1, #fff);
      font-variant-numeric: tabular-nums;
    }

    #cbn-badge[hidden] {
      display: none;
    }

    /* Rung 3 nhịp */
    #cbn-bell.cbn-shake svg {
      animation: cbn-shake .9s ease-in-out;
      transform-origin: 50% 10%;
    }

    #cbn-bell.cbn-shake #cbn-badge {
      animation: cbn-pop .9s ease-out;
    }

    @keyframes cbn-shake {

      0%,
      100% {
        transform: rotate(0);
      }

      10% {
        transform: rotate(16deg);
      }

      20% {
        transform: rotate(-14deg);
      }

      30% {
        transform: rotate(12deg);
      }

      40% {
        transform: rotate(-10deg);
      }

      50% {
        transform: rotate(7deg);
      }

      60% {
        transform: rotate(-5deg);
      }

      70% {
        transform: rotate(3deg);
      }

      80% {
        transform: rotate(-2deg);
      }
    }

    @keyframes cbn-pop {
      0% {
        transform: scale(1);
      }

      15% {
        transform: scale(1.3);
      }

      30%,
      100% {
        transform: scale(1);
      }
    }

    /* ---------- Menu thả xuống ---------- */
    #cbn-panel {
      position: fixed;
      top: 66px;
      right: 20px;
      z-index: 1001;
      width: 360px;
      max-width: calc(100vw - 32px);
      max-height: min(520px, 75vh);
      display: flex;
      flex-direction: column;
      background: var(--surface-1, #fff);
      color: var(--text-primary, #202124);
      border: 1px solid var(--line, #dadce0);
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(60, 64, 67, .25);
      overflow: hidden;
    }

    #cbn-panel[hidden] {
      display: none;
    }

    .cbn-p-head,
    .cbn-p-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
    }

    .cbn-p-head {
      border-bottom: 1px solid var(--line, #dadce0);
    }

    .cbn-p-foot {
      border-top: 1px solid var(--line, #dadce0);
      font-size: 13px;
      color: var(--text-secondary, #5f6368);
      flex-wrap: wrap;
    }

    .cbn-p-foot label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    #cbn-list {
      overflow-y: auto;
    }

    .cbn-empty {
      padding: 28px 16px;
      text-align: center;
      color: var(--text-muted, #80868b);
    }

    .cbn-item {
      padding: 12px 16px;
      border-bottom: 1px solid var(--line, #dadce0);
      cursor: pointer;
    }

    .cbn-item:last-child {
      border-bottom: 0;
    }

    .cbn-item:hover {
      background: var(--surface-2, #f1f3f4);
    }

    .cbn-item.unread {
      box-shadow: inset 3px 0 0 var(--cbn-red);
      background: color-mix(in srgb, var(--cbn-red) 6%, transparent);
    }

    .cbn-i-top {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }

    .cbn-time {
      margin-left: auto;
      color: var(--text-muted, #80868b);
      white-space: nowrap;
    }

    .cbn-i-branch {
      font-size: 13px;
      font-weight: 500;
      margin-top: 4px;
    }

    .cbn-i-text {
      font-size: 13px;
      color: var(--text-secondary, #5f6368);
      margin-top: 2px;
    }

    .cbn-brand {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--text-secondary, #5f6368);
    }

    .cbn-brand i,
    .cbn-t-brand i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      flex: none;
    }

    .cbn-stars {
      letter-spacing: 1px;
      font-size: 13px;
      white-space: nowrap;
    }

    .cbn-stars .on {
      color: var(--cbn-star);
    }

    .cbn-stars .off {
      color: var(--line, #dadce0);
    }

    .cbn-link {
      background: none;
      border: 0;
      padding: 4px 6px;
      border-radius: 6px;
      color: var(--cbn-blue);
      font: inherit;
      font-weight: 500;
      cursor: pointer;
    }

    .cbn-link:hover {
      background: var(--surface-2, #f1f3f4);
    }

    /* ---------- Toast ---------- */
    #cbn-toasts {
      position: fixed;
      top: 70px;
      right: 20px;
      z-index: 999;
      width: 360px;
      max-width: calc(100vw - 32px);
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    .cbn-toast {
      pointer-events: auto;
      background: var(--surface-1, #fff);
      color: var(--text-primary, #202124);
      border: 1px solid var(--line, #dadce0);
      border-left: 4px solid var(--warn, #f9ab00);
      border-radius: 12px;
      padding: 12px 14px;
      box-shadow: 0 4px 16px rgba(60, 64, 67, .22);
      animation: cbn-in .3s cubic-bezier(.2, .8, .2, 1);
    }

    .cbn-toast.r1 {
      border-left-color: var(--cbn-red);
    }

    .cbn-toast.cbn-sum {
      border-left-color: var(--cbn-blue);
    }

    .cbn-toast.cbn-out {
      animation: cbn-out .25s ease-in forwards;
    }

    @keyframes cbn-in {
      from {
        opacity: 0;
        transform: translateX(40px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    @keyframes cbn-out {
      to {
        opacity: 0;
        transform: translateX(40px);
      }
    }

    .cbn-t-top {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cbn-t-top b {
      font-size: 14px;
      font-weight: 500;
    }

    .cbn-x {
      margin-left: auto;
      background: none;
      border: 0;
      cursor: pointer;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      color: var(--text-muted, #80868b);
      font-size: 14px;
    }

    .cbn-x:hover {
      background: var(--surface-2, #f1f3f4);
    }

    .cbn-t-brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-secondary, #5f6368);
      margin-top: 4px;
    }

    .cbn-t-text {
      font-size: 13px;
      margin-top: 6px;
      line-height: 1.45;
    }

    .cbn-t-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 10px;
      font-size: 12px;
    }

    .cbn-muted {
      color: var(--text-muted, #80868b);
    }

    .cbn-view {
      border: 0;
      border-radius: 999px;
      padding: 6px 14px;
      cursor: pointer;
      background: var(--cbn-blue);
      color: #fff;
      font: inherit;
      font-size: 13px;
      font-weight: 500;
    }

    :root[data-theme="dark"] .cbn-view {
      color: #202124;
    }

    /* Nháy sáng review được mở từ cảnh báo */
    .rev.cbn-flash {
      animation: cbn-flash 3s ease-out;
      border-radius: 8px;
    }

    @keyframes cbn-flash {

      0%,
      30% {
        box-shadow: 0 0 0 3px var(--cbn-blue);
        background: color-mix(in srgb, var(--cbn-blue) 10%, transparent);
      }

      100% {
        box-shadow: 0 0 0 0 transparent;
        background: transparent;
      }
    }

    /* Người dùng bật "giảm chuyển động" trong hệ điều hành: tắt rung */
    @media (prefers-reduced-motion: reduce) {

      #cbn-bell.cbn-shake svg,
      #cbn-bell.cbn-shake #cbn-badge,
      .cbn-toast,
      .cbn-toast.cbn-out,
      .rev.cbn-flash {
        animation: none;
      }
    }

    /* Điện thoại */
    @media (max-width: 600px) {
      #cbn-bell {
        top: 10px;
        right: 12px;
      }

      #cbn-panel,
      #cbn-toasts {
        right: 12px;
        left: 12px;
        width: auto;
      }
    }

    #demo-tag {
      position: fixed;
      right: 16px;
      bottom: 12px;
      z-index: 998;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--surface-1, #fff);
      color: var(--text-secondary, #5f6368);
      border: 1px solid var(--line, #dadce0);
      box-shadow: 0 1px 3px rgba(60, 64, 67, .2);
      pointer-events: none
    }

    /* =====================================================================
       Print Stylesheet (Bố cục in báo cáo chuẩn PDF)
       ===================================================================== */
    @media print {
      body.modal-open {
        background: #ffffff !important;
        color: #000000 !important;
        font-family: system-ui, -apple-system, Roboto, sans-serif !important;
        font-size: 11pt !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      body.modal-open #app,
      body.modal-open #side,
      body.modal-open #demo-tag,
      body.modal-open #tip,
      body.modal-open #toasts,
      body.modal-open #cbn-root,
      body.modal-open button {
        display: none !important;
      }

      body.modal-open #report-modal {
        position: static !important;
        display: block !important;
        background: none !important;
        padding: 0 !important;
        margin: 0 !important;
        width: 100% !important;
        height: auto !important;
      }

      body.modal-open #report-modal>.card {
        border: none !important;
        box-shadow: none !important;
        max-width: 100% !important;
        width: 100% !important;
        max-height: none !important;
        overflow: visible !important;
        padding: 0 !important;
        margin: 0 !important;
        background: #ffffff !important;
        color: #000000 !important;
      }

      body.modal-open .grid.g4 {
        display: flex !important;
        flex-direction: row !important;
        gap: 12px !important;
        margin-bottom: 14px !important;
      }

      body.modal-open .grid.g4>.card.kpi {
        flex: 1 1 25% !important;
        border: 1px solid #dcdcdc !important;
        background: #fafafa !important;
        padding: 10px !important;
        break-inside: avoid !important;
        page-break-inside: avoid !important;
      }

      body.modal-open .card {
        break-inside: avoid !important;
        page-break-inside: avoid !important;
        border: 1px solid #e0e0e0 !important;
        background: #ffffff !important;
        color: #000000 !important;
        margin-bottom: 12px !important;
        padding: 12px !important;
      }

      body.modal-open .v {
        font-size: 16pt !important;
        font-weight: 700 !important;
        color: #000000 !important;
      }

      body.modal-open h2,
      body.modal-open h3 {
        color: #000000 !important;
        break-after: avoid !important;
        page-break-after: avoid !important;
      }

      body:not(.modal-open) #side,
      body:not(.modal-open) #demo-tag,
      body:not(.modal-open) #tip,
      body:not(.modal-open) #toasts,
      body:not(.modal-open) #cbn-root,
      body:not(.modal-open) .tabs,
      body:not(.modal-open) button {
        display: none !important;
      }

      body:not(.modal-open) #app {
        display: block !important;
      }
    }
  </style>
</head>

      function stripAccents(str) {
        return (str || '')
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .replace(/đ/gi, 'd')
          .toLowerCase();
      }

      function matchWords(text, words) {
        if (!text) return false;
        const pat1 = '(^|[^\\p{L}])(' + words.join('|') + ')([^\\p{L}]|$)';
        if (new RegExp(pat1, 'iu').test(text)) return true;
        const normText = stripAccents(text);
        const normWords = words.map(w => stripAccents(w));
        const pat2 = '(^|[^a-z0-9])(' + normWords.join('|') + ')([^a-z0-9]|$)';
        return new RegExp(pat2, 'i').test(normText);
      }

      function matchRegion(branchName, regionName, unitObj) {

          weight: 0.15,

        };

        var comps = [cRating, cSentiment, cRisk, cSov];
        var availableComps = comps.filter(function (c) { return c.value != null; });
        var missingComps = comps.filter(function (c) { return c.value == null; });
        var sumAvailableWeight = availableComps.reduce(function (sum, c) { return sum + c.weight; }, 0);

        var score = null;
        var calcNote = '';

        // ĐIỀU KIỆN MẪU TỐI THIỂU: Bỏ mọi fallback 90, 100 điểm khi thiếu dữ liệu
        if (total === 0 || availableComps.length === 0) {

          calcNote = 'Chưa đủ dữ liệu';
        } else if (total < 3) {

        } else if (availableComps.length === comps.length) {
          score = Math.round(comps.reduce(function (sum, c) { return sum + c.value * c.weight; }, 0));
          calcNote = 'Tính từ 4 thành phần theo đúng trọng số đang hiển thị';
        } else {
          if (sumAvailableWeight >= 0.5) {
            score = Math.round(availableComps.reduce(function (sum, c) {
              return sum + c.value * (c.weight / sumAvailableWeight);
            }, 0));
            calcNote = 'Chuẩn hóa trên ' + availableComps.length + ' thành phần có dữ liệu (tổng trọng số gốc ' + Math.round(sumAvailableWeight * 100) + '%). Thiếu: ' + missingComps.map(function (c) { return c.label; }).join(', ');
          } else {
            score = null;
            calcNote = 'Chưa đủ dữ liệu tối thiểu (thiếu: ' + missingComps.map(function (c) { return c.label; }).join(', ') + ')';
          }
        }

        // TÍNH TOÁN KỲ TRƯỚC: Không lấy hiện diện kỳ này tính cho kỳ trước!
        var prevCutoff = days ? cutoff - days * 864e5 : 0;
        var prevRevs = (pool || []).filter(function (r) {

          return t >= prevCutoff && t < cutoff;
        });

        var prevHealth = null;
        var deltaHealth = null;

        if (prevRevs.length >= 3 && score != null) {
          var prevRated = prevRevs.filter(function (r) { return r.rating != null && r.rating >= 1 && r.rating <= 5; });
          var prevRatingCount = prevRated.length;
          var prevAvg = prevRatingCount > 0 ? (prevRated.reduce(function (s, r) { return s + r.rating; }, 0) / prevRatingCount) : null;
          var prevPos = prevRevs.filter(function (r) { return (r.rating != null && r.rating >= 4) || (r.rating == null && r.analysis && r.analysis.sentiment === 'positive'); }).length;
          var prevNeg = prevRevs.filter(function (r) { return (r.rating != null && r.rating <= 2) || (r.rating == null && r.analysis && r.analysis.sentiment === 'negative'); }).length;
          var prevMentionCount = prevRevs.filter(function (r) { return r.rating == null; }).length;

            prevHealth = Math.round(prevCRating * 0.35 + prevCSentiment * 0.25 + prevCRisk * 0.25 + prevCSov * 0.15);

        };
      }

      /* =========================================================================
         NHÓM CHỈ SỐ B: MỨC HOÀN THIỆN HỒ SƠ (PROFILE COMPLETENESS) - YÊU CẦU 1 & 3
         Quy tắc:
         - Gọi đúng là "Mức hoàn thiện hồ sơ", không dùng chung tên Health Score

         - Trường nguồn chưa cung cấp là "chưa xác định" (unknown), không tự tính thiếu
         ========================================================================= */
      function calcProfileCompleteness(loc, industry) {
        if (!loc || !loc.locationId) return { percentage: null, completenessScore: null, displayPercentage: 'Chưa đủ dữ liệu', completedCount: null, applicableCount: 0, evaluatedCount: 0, unknownCount: 0, missingCount: 0, missingFields: [], details: [] };

        var ind = loc.industry || industry || 'generic';
        var isClinicOrRestaurant = (ind === 'aesthetic_clinic' || ind === 'f_and_b');

        var fieldDefs = [
          { key: 'displayName', label: 'Tên địa điểm', applicable: true, check: function (l) { return Boolean(l.displayName); } },
          { key: 'address', label: 'Địa chỉ chi tiết', applicable: true, check: function (l) { return Boolean(l.address && l.address.length >= 10); } },
          { key: 'primaryCategory', label: 'Danh mục chính', applicable: true, check: function (l) { return Boolean(l.primaryCategory); } },
          { key: 'phone', label: 'Số điện thoại liên hệ', applicable: true, check: function (l) { return Boolean(l.phone); } },
          { key: 'website', label: 'Website chính thức', applicable: true, check: function (l) { return Boolean(l.website); } },
          { key: 'regularHours', label: 'Giờ mở cửa hàng ngày', applicable: true, check: function (l) { return Boolean(l.regularHours && Object.keys(l.regularHours).length >= 5); } },
          { key: 'description', label: 'Mô tả giới thiệu', applicable: true, check: function (l) { return Boolean(l.description && l.description.length >= 25); } },
          { key: 'coverPhoto', label: 'Ảnh bìa (Cover Photo)', applicable: true, check: function (l) { return Boolean(l.coverPhoto || (l.media && l.media.cover)); } },
          { key: 'logoPhoto', label: 'Ảnh đại diện / Logo', applicable: true, check: function (l) { return Boolean(l.logoPhoto || (l.media && l.media.logo)); } },
          { key: 'interiorPhotos', label: 'Ảnh không gian bên trong', applicable: true, check: function (l) { return Boolean((l.interiorPhotos && l.interiorPhotos.length) || (l.media && l.media.interior && l.media.interior.length)); } },
          { key: 'exteriorPhotos', label: 'Ảnh mặt tiền / ngoại thất', applicable: true, check: function (l) { return Boolean((l.exteriorPhotos && l.exteriorPhotos.length) || (l.media && l.media.exterior && l.media.exterior.length)); } },
          { key: 'bookingUrl', label: 'Liên kết đặt hẹn / Booking', applicable: isClinicOrRestaurant, check: function (l) { return Boolean(l.bookingUrl); } },
          { key: 'serviceArea', label: 'Vùng phục vụ (Giao hàng/Di động)', applicable: Boolean(loc.isServiceAreaBusiness), check: function (l) { return Boolean(l.serviceArea && l.serviceArea.length); } },
          { key: 'attributes', label: 'Thuộc tính tiện ích', applicable: true, check: function (l) { return Boolean(l.attributes && l.attributes.length > 0); } }
        ];

        var applicableDefs = fieldDefs.filter(function (f) { return f.applicable; });
        var completedCount = 0;
        var unknownCount = 0;
        var missingFields = [];

        for (var i = 0; i < applicableDefs.length; i++) {
          var def = applicableDefs[i];
          var rawVal = loc[def.key];
          if (rawVal === undefined && (!loc.media || loc.media[def.key] === undefined)) {
            unknownCount++;
            details.push({ key: def.key, label: def.label, status: 'unknown', text: 'Chưa xác định từ nguồn' });
            continue;
          }

          var isOk = def.check(loc);
          if (isOk) {
            completedCount++;
            details.push({ key: def.key, label: def.label, status: 'completed', text: 'Đã hoàn thiện' });
          } else {
            missingFields.push({ key: def.key, label: def.label });
            details.push({ key: def.key, label: def.label, status: 'missing', text: 'Cần bổ sung' });
          }
        }

        var evaluatedCount = applicableDefs.length - unknownCount;
        var percentage = evaluatedCount > 0 ? Math.round((completedCount / evaluatedCount) * 100) : null;

        return {
          percentage: percentage,
          displayPercentage: percentage != null ? (percentage + '%') : 'Chưa đủ dữ liệu',
          completedCount: completedCount,
          applicableCount: applicableDefs.length,
          evaluatedCount: evaluatedCount,

          missingCount: missingFields.length,
          missingFields: missingFields,

      /* =========================================================================
         NHÓM CHỈ SỐ C: HIỆU QUẢ HIỆN DIỆN VÀ VẬN HÀNH (PRESENCE & PERFORMANCE) - YÊU CẦU 1 & 2
         Phân biệt rõ:
         - Lượt bấm nút gọi (Call Clicks) != Cuộc gọi thực tế đã kết nối
         - Lượt yêu cầu chỉ đường (Directions) != Khách đã đến cơ sở
         - Lượt xem (Impressions) != Người dùng duy nhất (Unique Visitors)
         - Cụm từ tìm kiếm (Search Queries) != Thứ hạng từ khóa địa phương (Local Rank)
         ========================================================================= */
      function calcBrandPerformance(brandId, days) {
        var brandLocs = getBrandLocations(brandId);
        var searchImpressions = brandLocs.reduce(function (s, l) { return s + (l.performance ? l.performance.searchImpressions : 0); }, 0);
        var callClicks = brandLocs.reduce(function (s, l) { return s + (l.performance ? l.performance.callClicks : 0); }, 0);
        var directionRequests = brandLocs.reduce(function (s, l) { return s + (l.performance ? l.performance.directionRequests : 0); }, 0);
        var websiteClicks = brandLocs.reduce(function (s, l) { return s + (l.performance ? l.performance.websiteClicks : 0); }, 0);

        // Tổng hợp top search queries từ các địa điểm
        var queryMap = {};
        brandLocs.forEach(function (l) {
          if (l.performance && l.performance.searchQueries) {
            l.performance.searchQueries.forEach(function (sq) {
              queryMap[sq.query] = (queryMap[sq.query] || 0) + sq.count;
            });
          }
        });

        var searchQueries = Object.keys(queryMap).map(function (q) {
          return { query: q, count: queryMap[q] };
        }).sort(function (a, b) { return b.count - a.count; }).slice(0, 5);

        return {
          searchImpressions: searchImpressions,
          callClicks: callClicks,
          directionRequests: directionRequests,
          websiteClicks: websiteClicks,

          sourceDisclaimer: 'Số liệu truy vấn từ Google Performance API. Lượt bấm gọi và yêu cầu chỉ đường là hành vi tương tác trên Maps, không đại diện cho cuộc gọi kết nối thành công hoặc lượt khách thực tế đến cửa hàng.'
        };
      }
      window.calcBrandPerformance = calcBrandPerformance;

      /* =========================================================================
         BỘ ĐIỀU KIỆN SMART GROUP (DYNAMIC GROUPS) - YÊU CẦU 4
         ========================================================================= */
      function evalSmartGroupConditions(loc, conditions, logic) {
        if (!conditions || !conditions.length) return true;
        logic = (logic || 'AND').toUpperCase();

        var results = conditions.map(function (cond) {
          var field = cond.field;
          var op = cond.op || cond.operator;
          var val = cond.value;

          var actual = null;
          if (field === 'googleRating') actual = loc.googleRating;
          else if (field === 'googleTotalReviews') actual = loc.googleTotalReviews;
          else if (field === 'businessStatus') actual = loc.businessStatus;
          else if (field === 'region' || field === 'province') actual = loc.region || loc.province;
          else if (field === 'profileCompleteness') actual = calcProfileCompleteness(loc).percentage;
          else actual = loc[field];

          if (op === '>') return Number(actual) > Number(val);
          if (op === '>=') return Number(actual) >= Number(val);
          if (op === '<') return Number(actual) < Number(val);
          if (op === '<=') return Number(actual) <= Number(val);
          if (op === '=' || op === '==') return String(actual).toLowerCase() === String(val).toLowerCase();
          if (op === '!=') return String(actual).toLowerCase() !== String(val).toLowerCase();
          if (op === 'contains') return String(actual || '').toLowerCase().includes(String(val || '').toLowerCase());
          return true;
        });

        if (logic === 'OR') {
          return results.some(Boolean);
        }
        return results.every(Boolean);
      }

      function J(o, s) { return new Response(typeof o === 'string' ? o : JSON.stringify(o), { status: s || 200, headers: { 'Content-Type': 'application/json' } }); }

      /* =========================================================================

      window.fetch = async function (u, opt) {
        var url = new URL(typeof u === 'string' ? u : u.url, 'http://demo.local');
        var p = url.pathname;
        if (p.indexOf('/api/') !== 0) return J({}, 404);
        var method = ((opt && opt.method) || 'GET').toUpperCase();

        if (method !== 'GET') {

            var pathParts = p.slice(5).split('/');

            // 1. Workflow & Review reply update
            if (p.indexOf('/workflow') !== -1 && body.id) {

                    createdAt: new Date().toISOString()
                  });
                }
                return J({ ok: true, item: target });
              }
            }

            // 2. Location Profile update (Lưu nháp vs Gửi Google API - Tách biệt rõ ràng & Cô lập thương hiệu)
            if (p.includes('/locations/') && p.includes('/profile')) {
              var locParts = p.split('/');
              var targetLocId = locParts[locParts.indexOf('locations') + 1];
              var targetBrand = brandFromPath || body.brandId || S.brand || 'seoul-center';
              var locObj = SHARED_LOCATIONS.find(function (l) { return l.locationId === targetLocId; });
              if (!locObj) return J({ error: 'Không tìm thấy địa điểm', code: 'LOCATION_NOT_FOUND' }, 404);

              // CÔ LẬP THƯƠNG HIỆU: Địa điểm phải thuộc đúng thương hiệu được gọi
              if (locObj.brandId !== targetBrand) {
                return J({
                  error: 'Truy cập bị từ chối: Địa điểm không thuộc thương hiệu ' + targetBrand + ' (Brand Isolation Violation)',

              }

              var action = body.action || 'save_draft'; // 'save_draft' | 'submit_google'
              var updates = body.updates || {};
              var explicitDeletes = body.explicitDeletes || [];

              // Audit diff tracking
              var diffs = [];
              Object.keys(updates).forEach(function (k) {
                diffs.push({ field: k, before: locObj[k], after: updates[k], type: 'update' });
              });
              explicitDeletes.forEach(function (k) {
                diffs.push({ field: k, before: locObj[k], after: null, type: 'delete' });
              });

              if (action === 'submit_google') {
                // Thao tác mới nhất phải thay thế yêu cầu cũ:
                var draftUpdates = (locObj.profileDraft && locObj.profileDraft.updates) || {};
                var draftDeletes = (locObj.profileDraft && locObj.profileDraft.explicitDeletes) || [];
                var bodyUpdates = updates || {};
                var bodyDeletes = explicitDeletes || [];

                // Bắt đầu từ danh sách delete của draft
                var allDeletes = draftDeletes.slice();
                bodyDeletes.forEach(function (k) {
                  if (!allDeletes.includes(k)) allDeletes.push(k);
                });

                // NGUYÊN TẮC: Giá trị cập nhật mới nhất PHẢI THAY THẾ yêu cầu xóa cũ!
                // Nếu người dùng nhập website mới (hoặc trường bất kỳ có giá trị), gỡ trường đó khỏi allDeletes!
                Object.keys(bodyUpdates).forEach(function (k) {
                  if (bodyUpdates[k] !== undefined && bodyUpdates[k] !== null && String(bodyUpdates[k]).trim() !== '') {

              } else {
                // save_draft: Lưu bền vững theo workspace/brand/location
                var currentDraft = locObj.profileDraft || (typeof loadPersistedDraft === 'function' ? loadPersistedDraft(targetBrand, targetLocId) : null) || { updates: {}, explicitDeletes: [] };
                var curDeletes = (currentDraft.explicitDeletes || []).slice();

                  }
                });

                var mergedUpdates = Object.assign({}, currentDraft.updates || {}, newUpdates);
                curDeletes.forEach(function (delKey) {

                locObj.profileDraft = {

              return J({
                ok: true,
                action: action,

                auditStatus: action === 'submit_google' ? 'Đã mô phỏng đồng bộ Google Business Profile (GBP API) thành công' : 'Đã lưu bản nháp nội bộ an toàn',
                diffs: diffs,

                draft: locObj.profileDraft,
                completeness: calcProfileCompleteness(locObj)
              });
            }

            // 3. Multi-location Post Dispatcher (Kiểm soát biến & Cô lập thương hiệu)
            if (p.includes('/posts/dispatch')) {
              var brandId = brandFromPath || body.brandId || S.brand || 'seoul-center';
              var bConfig = getBrandConfig(brandId);
              var brandLocs = getBrandLocations(brandId);
              var rawContent = body.masterContent || (body.masterPost && body.masterPost.content) || '';
              var targetLocIds = body.targetLocationIds || [];

              // KIỂM TRA CÔ LẬP THƯƠNG HIỆU (BRAND ISOLATION):
              // Nếu người dùng truyền targetLocationIds, tất cả phải thuộc thương hiệu này
              if (targetLocIds && targetLocIds.length > 0) {
                var foreignLocs = targetLocIds.filter(function (id) {
                  return !brandLocs.some(function (bl) { return bl.locationId === id; });
                });
                if (foreignLocs.length > 0) {
                  return J({
                    error: 'Truy cập bị từ chối: Địa điểm không thuộc thương hiệu ' + bConfig.name + ' (Brand Isolation Violation)',
                    code: 'FORBIDDEN_LOCATION_OWNERSHIP',

              }

              // Nếu không truyền ID cụ thể hoặc scope = 'all', mặc định gửi toàn bộ chi nhánh của thương hiệu
              if (!targetLocIds || targetLocIds.length === 0 || body.scope === 'all') {

              }

              targetLocIds = Array.from(new Set(targetLocIds));

              var targetLocations = brandLocs.filter(function (l) {
                return targetLocIds.includes(l.locationId);

              var jobId = 'job_' + Date.now();
              var results = [];
              var missingVarWarnings = [];

              targetLocations.forEach(function (loc, idx) {

                var hotline = loc.phone || '';

                if (rawContent.includes('{{booking_link}}') && !loc.bookingUrl && !loc.website) {

                var resolvedContent = rawContent
                  .replace(/{{brand_name}}/g, bConfig.name)

    function generateRealQrSvg(text, size) {
      size = size || 160;
      if (!text) text = 'https://google.com';
      try {
        var typeNumber = QRCode.getTypeNumber ? QRCode.getTypeNumber(text, QRCode.CorrectLevel.M) : 4;

        var scale = (size - 16) / count;
        var rects = [];
        for (var r = 0; r < count; r++) {
          for (var c = 0; c < count; c++) {
            if (qr.isDark(r, c)) {
              var x = (8 + c * scale).toFixed(2);
              var y = (8 + r * scale).toFixed(2);
              var w = (scale + 0.05).toFixed(2);
              var h = (scale + 0.05).toFixed(2);
              rects.push('<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" fill="#1e293b"/>');
            }
          }
        }
        return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + size + ' ' + size + '" width="' + size + '" height="' + size + '" style="background:#fff;padding:4px;border-radius:8px;border:1px solid #cbd5e1"><rect width="100%" height="100%" fill="#fff"/>' + rects.join('') + '</svg>';

      }
    }

    function downloadQrSvg(url, filename) {
      try {
        const svgStr = generateRealQrSvg(url, 300);
        const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = (filename || 'qr-code') + '.svg';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        toast('✓ Đã tải file QR SVG độ nét cao cho in ấn thành công!');
      } catch (e) {
        toast('Lỗi tải SVG: ' + e.message);
      }
    }

    function downloadQrPng(url, filename) {
      try {
        const svgStr = generateRealQrSvg(url, 400);
        const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
        const urlObj = URL.createObjectURL(blob);
        const img = new Image();
        img.onload = function () {
          const canvas = document.createElement('canvas');
          canvas.width = 400;
          canvas.height = 400;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          URL.revokeObjectURL(urlObj);
          canvas.toBlob(function (pngBlob) {
            if (!pngBlob) { toast('Lỗi chuyển định dạng PNG'); return; }
            const link = document.createElement('a');
            link.href = URL.createObjectURL(pngBlob);
            link.download = (filename || 'qr-code') + '.png';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            toast('✓ Đã tải file QR PNG thành công!');
          }, 'image/png');
        };
        img.onerror = function () {
          toast('Lỗi vẽ ảnh QR lên Canvas');
        };
        img.src = urlObj;
      } catch (e) {
        toast('Lỗi tải PNG: ' + e.message);
      }
    }

    function isSafeUrl(url) {
      if (!url || typeof url !== 'string') return false;
      var trimmed = url.trim().toLowerCase();
      return (trimmed.startsWith('https://') || trimmed.startsWith('http://')) && !/^(javascript|data|vbscript):/i.test(trimmed);
    }

    function parseUrlSafe(rawUrl) {
      if (!rawUrl || typeof rawUrl !== 'string') return null;
      var trimmed = rawUrl.trim();
      if (!trimmed) return null;
      try {
        var u = new URL(trimmed);
        if (u.protocol !== 'http:' && u.protocol !== 'https:') return null;
        return u;
      } catch (e) {
        return null;
      }
    }

    function isSearchUrl(url) {
      if (!url || typeof url !== 'string') return false;
      var lower = url.toLowerCase();
      return (lower.includes('google.') && lower.includes('/search')) || lower.includes('bing.com/search') || lower.includes('search.yahoo.com');

    /* ---------- renderSourceLink (Fix B4) ---------- */
    function renderSourceLink(r, btnClass = 'btn') {
      if (!r) return '';

      }
      var host = u.hostname.toLowerCase();
      var path = u.pathname.toLowerCase();

      // Link tìm kiếm: phân biệt rõ công cụ tìm kiếm & ghi chú không phải dẫn chứng gốc
      if ((host.includes('google.') && (path.includes('/search') || u.searchParams.has('q'))) || host.includes('bing.com') || host.includes('search.yahoo.com')) {

    function tipAttr(html) {

    function stacked(rows, { h = 190 } = {}) {
      if (!rows || !rows.length) return '<div class="empty">Chưa có review theo tuần trong kỳ</div>';
      const W = 640, P = { l: 30, r: 6, t: 8, b: 22 };
      const keys = [['negative', '--bad', 'Tiêu cực'], ['neutral', '--neutral', 'Trung tính'], ['positive', '--good', 'Tích cực']];
      const max = Math.max(1, ...rows.map((r) => r.total));
      const ph = h - P.t - P.b;
      const bw = (W - P.l - P.r) / rows.length;
      let g = '';
      for (let i = 0; i <= 4; i++) {
        const y = P.t + (ph * i) / 4;
        g += `<line x1="${P.l}" x2="${W - P.r}" y1="${y}" y2="${y}"/><text x="${P.l - 6}" y="${y + 4}" text-anchor="end">${Math.round(max - (max * i) / 4)}</text>`;
      }
      let bars = '';
      rows.forEach((r, i) => {
        const x = P.l + i * bw;
        let y = h - P.b;
        for (const [k, c] of keys) {
          const sh = (r[k] / max) * ph;
          if (sh > 0) {
            bars += `<rect x="${x + bw * 0.2}" y="${y - sh}" width="${bw * 0.6}" height="${sh}" fill="var(${c})" stroke="var(--surface-1)" stroke-width="2"/>`;
            y -= sh;
          }

        const tip = `<b>Tuần ${fmtDate(r.week)}</b><br>Tích cực: ${r.positive}<br>Trung tính: ${r.neutral}<br>Tiêu cực: ${r.negative}` + (r.avg ? `<br>Sao TB: ${r.avg}` : '');
        bars += `<rect class="hit" x="${x}" y="${P.t}" width="${bw}" height="${ph}" fill="transparent" ${tipAttr(tip)}/>`;
        if (i % 2 === 0 || rows.length < 9) bars += `<text x="${x + bw / 2}" y="${h - 6}" text-anchor="middle">${new Date(r.week).toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit' })}</text>`;
      });
      return `<svg viewBox="0 0 ${W} ${h}" width="100%" role="img" aria-label="Review theo tuần"><g class="grid">${g}</g>${bars}</svg>
  <div class="legend">${keys.slice().reverse().map(([, c, l]) => `<span><i style="background:var(${c})"></i>${l}</span>`).join('')}</div>`;
    }

    function simpleBars(rows, { h = 150, color = '--bad', label = 'review tiêu cực' } = {}) {
      const W = 640, P = { l: 26, r: 6, t: 8, b: 22 };
      const max = Math.max(1, ...rows.map((r) => r.v));
      const ph = h - P.t - P.b;
      const bw = (W - P.l - P.r) / rows.length;

        g += `<line x1="${P.l}" x2="${W - P.r}" y1="${y}" y2="${y}"/><text x="${P.l - 6}" y="${y + 4}" text-anchor="end">${Math.round(max - (max * i) / 2)}</text>`;
      }

    function lineChart(labels, series, { h = 190, min = null, max = null, dec = 1 } = {}) {
      const W = 640, P = { l: 34, r: 10, t: 10, b: 22 };
      const vals = series.flatMap((s) => s.vals).filter((v) => v != null);
      if (!vals.length) return '<div class="empty">Chưa có dữ liệu</div>';
      const lo = min ?? Math.floor(Math.min(...vals) - 0.2), hi = max ?? Math.ceil(Math.max(...vals) + 0.2);
      const ph = h - P.t - P.b;
      const X = (i) => P.l + (labels.length === 1 ? (W - P.l - P.r) / 2 : (i * (W - P.l - P.r)) / (labels.length - 1));
      const Y = (v) => P.t + ph - ((v - lo) / (hi - lo || 1)) * ph;
      let g = '';
      for (let i = 0; i <= 4; i++) {

      }
      let out = '';
      for (const s of series) {
        const pts = s.vals.map((v, i) => (v == null ? null : [X(i), Y(v)]));

        out += `<rect class="hit" x="${X(i) - cw / 2}" y="${P.t}" width="${cw}" height="${ph}" fill="transparent" ${tipAttr(tip)}/>`;
        if (labels.length < 10 || i % Math.ceil(labels.length / 8) === 0) out += `<text x="${X(i)}" y="${h - 6}" text-anchor="middle">${esc(l)}</text>`;

    // Màu cố định theo thứ tự thương hiệu: brand mình xanh, đối thủ lần lượt các màu còn lại
    const ENT_COLORS = ['--series-1', '--series-2', '--series-3', '--warn', '--seq-2', '--neutral'];
    const entColor = (entities, id) => (id === 'other' ? '--neutral' : ENT_COLORS[Math.max(0, entities.findIndex((e) => e.id === id)) % ENT_COLORS.length]);

    // Bảng so sánh đối thủ: dòng brand mình tô nền, ▲▼ so với snapshot ≥ 7 ngày trước
    function compTable(rows, prev, { entities = null, extra = false, lastCompetitorSync = null } = {}) {
      const old = Object.fromEntries((prev?.entities || []).map((e) => [e.id, e]));
      const maxNeg = Math.max(0, ...rows.map((t) => t.negShare30 ?? 0));
      const chg = (cur, was, { dec = 2, int = false } = {}) => {
        if (cur == null || was == null) return '';
        const d = +(cur - was).toFixed(dec);
        if (!d) return '';
        return ` <span class="chg ${d > 0 ? 'up' : 'down'}">${d > 0 ? '▲' : '▼'}${int ? fmtInt(Math.abs(d)) : fmtRating(Math.abs(d), dec)}</span>`;
      };
      const dot = (id) => (entities ? `<i class="edot" style="background:var(${entColor(entities, id)})"></i>` : '');
      const negCls = (v) => [v != null && v > 0.1 ? 'negbad' : '', v && v === maxNeg ? 'negmax' : ''].join(' ');
      const body = rows.map((t) => {
        const o = old[t.id] || {};

      <td class="num">${t.googleRating != null ? `${fmtRating(t.googleRating, 1)} <span class="star">★</span>${chg(t.googleRating, o.googleRating)}` : '-'}</td>
      <td class="num">${fmtInt(t.googleTotal)}${chg(t.googleTotal, o.googleTotal, { int: true, dec: 0 })}</td>
      <td class="num">${fmtRating(t.avg90, 2)}</td>
      <td class="num">${fmtInt(t.vol30)}</td>${extra ? `<td class="num">${fmtInt(t.volPrev30)}</td>` : ''}
      <td class="num"><span class="${negCls(t.negShare30)}">${pct(t.negShare30)}</span></td></tr>`;
      }).join('');
      const note = [
        prev ? `▲▼ so với ngày ${fmtDate(prev.date)}.` : 'Mũi tên ▲▼ so với tuần trước sẽ hiện khi hệ thống lưu đủ 7 ngày lịch sử.',
        'Điểm và tổng review Google lấy từ Google Maps; sao TB, số review và tỷ lệ tiêu cực tính trên review đã thu thập.',
        lastCompetitorSync ? `Đối thủ cập nhật mỗi ${S.cfg?.competitorDays ?? 7} ngày, lần gần nhất ${fmtDate(lastCompetitorSync)}.` : '',

      return `<table class="comp"><tr><th>Thương hiệu</th><th class="num">Điểm Google</th><th class="num">Tổng review Google</th><th class="num">Sao TB 90 ngày</th><th class="num">Review 30 ngày</th>${extra ? '<th class="num">30 ngày trước đó</th>' : ''}<th class="num">Tỷ lệ tiêu cực</th></tr>${body}</table>
  <p class="muted" style="margin:8px 0 0;font-size:12px">${note}</p>`;

    const reviewHtml = (r, { compact = false } = {}) => {

      const slaBadge = r.ticketStatus === 'resolved'

      return `<div class="rev" data-id="${esc(r.id)}">

  <div style="margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap">
    ${statusBadge}
    ${replyBadge}

  <div class="rev-body">
    ${txt ? `<div class="txt">${esc(txt)}</div><button class="more-btn" data-act="expand">Thêm</button>` : (r.rating != null ? `<div class="txt muted" style="font-style:italic">Chỉ đánh giá ${r.rating} sao, không có nội dung nhận xét.</div>` : '<div class="txt muted" style="font-style:italic">Nội dung bài viết / mention trực tuyến.</div>')}

    ${compact ? '' : `<div class="rev-chips">${sl ? `<span class="chip ${sc}">${sl}</span>` : ''}${a.severity >= 2 ? `<span class="sev s${a.severity}">Mức ${a.severity}/3</span>` : ''}${(a.topics || []).map((t) => `<button class="chip" data-act="drill-topic" data-v="${esc(t)}" style="cursor:pointer" title="Bấm để lọc review theo chủ đề này">${esc(S.topicLabels?.[t] || t)} ↗</button>`).join('')}</div>`}
    ${latestNote}
    ${r.reply ? `<div class="owner-reply"><div class="meta"><b>${r.reply.isSimulated ? 'Mô phỏng phản hồi của chủ sở hữu' : 'Phản hồi của chủ sở hữu trên Google'}</b> · ${timeAgo(r.reply.date)} ${r.reply.isSimulated ? '<span class="chip" style="font-size:10px;background:#e0f2fe;color:#0369a1;padding:1px 5px">Snapshot demo</span>' : ''}</div><div class="txt">${esc(r.reply.text)}</div><button class="more-btn" data-act="expand">Thêm</button></div>` : ''}

        const cMissing = rawCompB.missingCount ?? (cTotal != null && cValid != null ? Math.max(0, cTotal - cValid) : null);
        const compB = {
          completenessScore: cScore,

        };
        const compC = o.presencePerformance || { searchImpressions: 41450, callClicks: 920, directionRequests: 1610, websiteClicks: 2480 };
        const fleet = o.fleet || { total: 3, connected: 3, open: 3, disconnected: 0 };
        const triage = o.triage || { unreplied: 135, overdue: 10, negative: 5, incompleteProfiles: 1, failedPosts: 1, upcomingCalendar: 2 };
        const searchQueries = (o.performance && o.performance.topSearchQueries) || [
          { query: 'thẩm mỹ viện quận 10', impressions: 12400, share: 29.9 },

          { query: 'seoul center bình thạnh', impressions: 7200, share: 17.4 },

        const range = `<div class="tabs">${[7, 30, 90].map((d) => `<button class="btn ${S.days === d ? 'on' : ''}" data-act="range" data-v="${d}">${d} ngày</button>`).join('')}</div>`;
        const comps = h.components?.length

          : `<div class="muted">${esc(h.note || 'Chưa đủ dữ liệu')}</div>`;

        // 1. THANH TRẠNG THÁI MẠNG LƯỚI & KẾT NỐI (FLEET STATUS)
        const fleetHtml = `<div class="card" style="margin-bottom:14px;background:var(--surface-1);border:1px solid var(--line);border-radius:12px;padding:14px 18px">
          <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
            <div style="display:flex;align-items:center;gap:8px">

            <b>📌 Phân biệt ranh giới chuẩn mực chỉ số vận hành Google Business:</b><br>
            • <b>Bấm gọi (Call clicks):</b> Ghi nhận thao tác người dùng bấm nút gọi trên di động, <u>không tương đương</u> cuộc gọi thực tế đã kết nối.<br>
            • <b>Yêu cầu chỉ đường (Direction requests):</b> Ghi nhận số lượt mở tuyến đường chỉ dẫn, <u>không tương đương</u> số lượng khách hàng thực tế đã đến cơ sở.<br>
            • <b>Lượt xem / Hiển thị (Impressions):</b> Số lần hồ sơ hiển thị trên màn hình người dùng, <u>không tương đương</u> số người dùng duy nhất (Unique users).<br>
            • <b>Cụm từ tìm kiếm (Search queries):</b> Từ khóa kích hoạt hiển thị hồ sơ, <u>không đồng nghĩa</u> với thứ hạng từ khóa (Local Rank vị trí 1, 2, 3).<br>

        return (

      // 2. TRUNG TÂM CÔNG VIỆC (ACTION CENTER - PHẦN O)

                    <span>${activeGroup.type === 'smart' ? '⚡ ' : '📁 '}${esc(activeGroup.name)}</span>
                    <span class="chip" style="font-size:11px;font-weight:700">${activeGroup.type === 'smart' ? 'Nhóm Động (Smart Group)' : 'Nhóm Tĩnh'}</span>
                  </h3>
                  <div class="muted" style="font-size:12px;margin-top:3px">Quản lý phụ trách: <b>${esc(activeGroup.manager || 'Chưa phân công')}</b> · Đánh giá gần nhất: <b>${fmtTime(activeGroup.lastEvaluatedAt || new Date().toISOString())}</b></div>

      // 5. CHI TIẾT ĐỊA ĐIỂM (LOCATION DETAIL - PHẦN H)
      async location_detail() {
        const brandLocs = getBrandLocations(S.brand);
        if (!brandLocs || !brandLocs.length) {
          return (
            head('Hồ sơ Địa điểm GBP', 'Chi tiết thông tin doanh nghiệp, trạng thái đồng bộ và hình ảnh niêm yết.') + banner() +
            `<div class="card" style="padding:48px 24px;text-align:center;background:var(--surface-1);border:1px dashed var(--line);border-radius:12px;margin-top:16px">
              <div style="font-size:48px;margin-bottom:12px">📍</div>
              <h3 style="margin:0 0 8px 0;font-size:18px">Thương hiệu chưa có địa điểm nào được kết nối</h3>
              <p class="muted" style="max-width:520px;margin:0 auto 20px auto;font-size:13px;line-height:1.6">
                Thương hiệu hiện tại chưa có cơ sở nào trong hệ thống hoặc chưa liên kết tài khoản Google Business Profile (GBP). Vui lòng kết nối tài khoản Google hoặc thêm địa điểm kinh doanh để bắt đầu quản lý hồ sơ.
              </p>
              <div style="display:flex;justify-content:center;gap:10px">
                <button class="btn primary" data-act="nav" data-v="connections">🔗 Kết nối Google Business Profile</button>
                <button class="btn" data-act="nav" data-v="overview">⬅ Quay lại Tổng quan</button>
              </div>
            </div>`
          );
        }

        const locId = S.selectedLocationId || (brandLocs[0] ? brandLocs[0].locationId : '');
        const loc = brandLocs.find(l => l.locationId === locId) || brandLocs[0];
        // Đảm bảo nạp bản nháp mới nhất từ localStorage nếu có
        if (loc && typeof loadPersistedDraft === 'function') {
          const savedDraft = loadPersistedDraft(S.brand, loc.locationId);
          if (savedDraft) {
            loc.profileDraft = savedDraft;
            loc.googleSyncStatus = 'draft_pending';
          }
        }
        const pool = (window.__DEMO_D && window.__DEMO_D.rev && window.__DEMO_D.rev[S.brand]?.pool) || [];
        const locRevs = pool.filter(r => r.locationId === loc.locationId || (r.branch && r.branch === loc.fullName));
        const unrepliedCount = locRevs.filter(isUnrepliedGoogleReview).length;
        const bConfig = getBrandConfig(S.brand);
        const rawCompleteness = (typeof calcProfileCompleteness === 'function' && loc.locationId)
          ? calcProfileCompleteness(loc, bConfig.industry)
          : { completenessScore: null, percentage: null, displayPercentage: 'Chưa đủ dữ liệu', completedCount: null, totalApplicableCount: null, missingCount: null, unknownCount: 0, missingFields: [] };
        const lScore = rawCompleteness.completenessScore ?? rawCompleteness.percentage ?? null;
        const lValid = rawCompleteness.completedCount ?? rawCompleteness.validCount ?? null;
        const lTotal = rawCompleteness.totalApplicableCount ?? rawCompleteness.applicableCount ?? null;
        const lMissing = rawCompleteness.missingCount ?? (lTotal != null && lValid != null ? Math.max(0, lTotal - lValid) : null);
        const completeness = {
          completenessScore: lScore,
          percentage: lScore,
          displayPercentage: rawCompleteness.displayPercentage || (lScore != null ? (lScore + '%') : 'Chưa đủ dữ liệu'),
          completedCount: lValid,
          validCount: lValid,
          totalApplicableCount: lTotal,
          applicableCount: lTotal,
          missingCount: lMissing,
          missingFields: rawCompleteness.missingFields || []
        };
        const activeTab = S.selectedLocTab || 'info';

        return (
          head('Trình Quản lý Hồ sơ Địa điểm (GBP Profile Manager)', `${loc.fullName} · Mã: ${loc.branchCode} · Place ID: ${loc.placeId}`) + banner() +

            <!-- Selector chọn cơ sở -->
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:16px;border-bottom:1px solid var(--line);padding-bottom:14px">

                <span style="font-weight:700;font-size:14px">Chi nhánh đang quản lý:</span>
                <select class="btn" onchange="S.selectedLocationId=this.value; render();" style="min-width:260px;font-weight:700">
                  ${brandLocs.map(l => `<option value="${l.locationId}" ${l.locationId === loc.locationId ? 'selected' : ''}>${esc(l.displayName)} (${esc(l.branchCode)})</option>`).join('')}
                </select>
                ${isLocationConnected(loc)
            ? '<span class="chip" style="background:#dcfce7;color:#15803d;font-weight:700">🟢 Đã kết nối Google API</span>'
            : '<span class="chip" style="background:#fee2e2;color:#b91c1c;font-weight:700">🔴 Chưa kết nối Google API</span>'}
                <span class="muted" style="font-size:11px">Đồng bộ gần nhất: ${fmtTime(loc.lastSyncedAt)}</span>
              </div>
              <div style="display:flex;gap:8px">
                <button class="btn" data-act="save-profile-draft" data-v="${esc(loc.locationId)}">💾 Lưu bản nháp nội bộ</button>
                <button class="btn primary" data-act="open-profile-diff" data-v="${esc(loc.locationId)}">🔍 Xem đối soát & Gửi Google API ↗</button>
              </div>

            <span>6.1. Hướng dẫn Kết nối Google Maps / Places API (New)</span>

          </summary>
          <div style="margin-top:12px;font-size:13px;line-height:1.6;color:var(--text-secondary);border-top:1px solid var(--line);padding-top:12px">
            <ol style="margin:0;padding-left:20px">
              <li><b>Đăng nhập Google Cloud Console:</b> Truy cập <a href="https://console.cloud.google.com/" target="_blank" rel="noopener noreferrer">console.cloud.google.com ↗</a> bằng tài khoản quản trị.</li>
              <li><b>Tạo hoặc chọn Project:</b> Tạo project mới (ví dụ: <code>brand-command-production</code>).</li>
              <li><b>Liên kết Billing:</b> Bắt buộc liên kết Billing Account để kích hoạt Places API (Google tặng 200$ tín dụng hàng tháng cho tài khoản mới).</li>
              <li><b>Bật API:</b> Vào <i>APIs & Services &gt; Library</i>, tìm kiếm và kích hoạt <b>Places API (New)</b>.</li>
              <li><b>Tạo API Key:</b> Vào <i>APIs & Services &gt; Credentials</i>, chọn <i>Create Credentials &gt; API key</i>.</li>
              <li><b>Giới hạn bảo mật Key (Bắt buộc):</b>
                <br>- <i>API restrictions:</i> Chỉ cho phép gọi <b>Places API (New)</b>.
                <br>- <i>Application restrictions:</i> Giới hạn IP của server backend (hoặc HTTP Referrers nếu dùng client có kiểm soát).
              </li>
              <li><b>Lấy Place ID của chi nhánh:</b> Dùng công cụ chính thức <a href="https://developers.google.com/maps/documentation/places/web-service/place-id" target="_blank" rel="noopener noreferrer">Place ID Finder ↗</a> hoặc API <i>Place Search</i>.</li>
              <li><b>Đối chiếu địa chỉ:</b> So khớp tên và địa chỉ thực tế để tránh nhầm lẫn giữa các chi nhánh cùng chuỗi.</li>
              <li><b>Lưu trữ Key an toàn:</b> Đặt key trong biến môi trường backend (<code>GOOGLE_MAPS_API_KEY</code>), <b>tuyệt đối không nhúng vào mã nguồn frontend</b>.</li>
              <li><b>Thử nghiệm Place Details với Field Mask tối thiểu:</b> Chỉ yêu cầu các trường cần thiết để tối ưu chi phí:</li>
            </ol>
            
            <div style="margin:10px 0;background:var(--surface-2);border-radius:6px;padding:12px;font-family:monospace;font-size:12px;overflow-x:auto">
              # Mẫu cURL thử nghiệm Place Details (Chỉ dùng Placeholder mẫu - KHÔNG nhúng key thật)<br>
              curl -X GET "https://places.googleapis.com/v1/places/YOUR_PLACE_ID_HERE?fields=id,displayName,rating,userRatingCount,reviews&languageCode=vi" \\<br>
              &nbsp;&nbsp;-H "Content-Type: application/json" \\<br>
              &nbsp;&nbsp;-H "X-Goog-Api-Key: YOUR_GCP_API_KEY_HERE"
            </div>

            <div style="margin-top:8px;font-size:12px" class="muted">
              📌 Kiểm tra quota, chi phí, quy định hiển thị logo Google (Attribution) và chính sách lưu trữ cache (tối đa 30 ngày cho Place Details) trước khi thiết lập cronjob.
